name: Docker Build and Push

on:
  workflow_run:
    workflows: ["release"]
    types: [completed]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    environment: PRODUCTION

    permissions:
      contents: read
      packages: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------------------------------
      # Get stable tag only
      # ---------------------------------------------------------
      - name: Get stable tag
        id: get_tag
        run: |
          git fetch --tags
          TAG=$(git tag -l "v*" | grep -v "dev" | sort -V | tail -n 1)
          if [ -z "$TAG" ]; then
            echo "No stable tag found"
            exit 1
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Found tag: $TAG"

      - name: Set lowercase repository name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      # ---------------------------------------------------------
      # Create .env file for build-time (Inject Method)
      # ---------------------------------------------------------
      - name: Create .env file for build
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "=== Creating .env.production file for build-time ==="
          
          # Inizializza il file
          > .env.production
          
          # Funzione helper per processare il JSON delle variabili
          process_vars() {
            local json_data="$1"
            # Se il json è vuoto o [], esci
            if [ "$json_data" == "[]" ] || [ -z "$json_data" ]; then return; fi

            echo "$json_data" | jq -r '.name' | while read -r VAR; do
              # Includiamo solo le variabili NEXT_PUBLIC_
              if [[ $VAR == NEXT_PUBLIC_* ]]; then
                VALUE=$(echo "$json_data" | jq -r "select(.name==\"$VAR\") | .value")
                echo "$VAR=$VALUE" >> .env.production
                echo "  ✓ Injected: $VAR"
              fi
            done
          }
          
          # 1. Variabili Repository (Base)
          echo "Fetching variables from repository level..."
          REPO_VARS=$(gh api repos/${GITHUB_REPOSITORY}/actions/variables --jq '.variables[]' 2>/dev/null || echo '[]')
          process_vars "$REPO_VARS"
          
          # 2. Variabili Environment PRODUCTION (Override)
          # Scritte dopo, così sovrascrivono quelle del repo in caso di duplicati
          echo "Fetching variables from PRODUCTION environment..."
          ENV_VARS=$(gh api repos/${GITHUB_REPOSITORY}/environments/PRODUCTION/variables --jq '.variables[]')
          process_vars "$ENV_VARS"
          
          echo "=== .env.production created ==="
          # Mostriamo solo i nomi delle variabili per sicurezza
          grep -o '^[^=]*' .env.production || echo "No NEXT_PUBLIC variables found"
          echo "================================"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------
      # Build + push production image
      # ---------------------------------------------------------
      - name: Build & Push Production Image
        run: |
          echo "=== Building Docker image ==="
          echo "Tags:"
          echo "  - ghcr.io/${REPO_LC}:${{ steps.get_tag.outputs.tag }}"
          echo "  - ghcr.io/${REPO_LC}:latest"
          echo ""
          
          # Nota: Non passiamo più --build-arg. 
          # Il Dockerfile farà 'COPY .env.production .' e Next.js lo userà.
          
          docker buildx build \
            --push \
            --file Dockerfile \
            --tag ghcr.io/${REPO_LC}:${{ steps.get_tag.outputs.tag }} \
            --tag ghcr.io/${REPO_LC}:latest \
            --cache-from type=registry,ref=ghcr.io/${REPO_LC}:buildcache \
            --cache-to type=registry,ref=ghcr.io/${REPO_LC}:buildcache,mode=max \
            --provenance=false \
            .
          
          echo "=== Build completed successfully ==="

      # ---------------------------------------------------------
      # Summary
      # ---------------------------------------------------------
      - name: Build Summary
        run: |
          echo "## 🚀 Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ steps.get_tag.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Images:**" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${REPO_LC}:${{ steps.get_tag.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${REPO_LC}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ⚠️ Runtime Configuration Required" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Remember to pass runtime environment variables when deploying:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker run -e NEXTAUTH_SECRET=xxx \\" >> $GITHUB_STEP_SUMMARY
          echo "           -e AUTH_SECRET=xxx \\" >> $GITHUB_STEP_SUMMARY
          echo "           -e KEYCLOAK_SECRET=xxx \\" >> $GITHUB_STEP_SUMMARY
          echo "           ghcr.io/${REPO_LC}:${{ steps.get_tag.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY